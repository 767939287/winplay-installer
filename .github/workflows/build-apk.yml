name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # 也支持手动点按钮构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 关键：复用同一个 debug keystore，否则每次构建签名都不同，
      # 新 APK 无法覆盖安装旧版（会提示「应用未安装/签名不一致」）
      - name: 缓存签名密钥
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/Xamarin/Mono for Android
            ~/.android
          key: android-debug-keystore-v1

      - name: 安装 android 编译链（Android SDK/JDK 自动准备）
        run: dotnet workload install android

      - name: 编译 Release APK
        run: dotnet publish -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winplay-installer-apk
          path: '**/*.apk'
          if-no-files-found: error
